# 每個交易日晚上 21:30（台北時間）自動更新信用交易資料：data/margin.json
# 也可以在 GitHub 的 Actions 頁面手動執行（Run workflow）
name: 每日信用交易更新

on:
  schedule:
    - cron: '30 13 * * 1-5'   # UTC 13:30＝台北 21:30，週一～週五；GitHub 排程可能延遲幾分鐘到幾十分鐘
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 抓取證交所、櫃買中心、玩股網資料
        shell: pwsh
        run: ./scripts/update-margin.ps1

      - name: 有變動才提交
        run: |
          if git diff --quiet -- data/margin.json; then
            echo "資料沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margin.json
          git commit -m "更新信用交易資料 $(TZ=Asia/Taipei date +%F)"
          git push
